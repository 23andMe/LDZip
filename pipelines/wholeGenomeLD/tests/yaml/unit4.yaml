pfile_template: '${projectDir}/../../assets/g1k.chr{CHR}'
chroms: '20,21,22'
ld_window_kb: 50
ld_threads: 1
stage_plink: true
# High MAF cutoff leaves some chr22 chunks with no variants (empty chunk handling)
ld_filter: '--maf 0.49'
# Pairwise concat with one-empty and both-empty pairs
concat_pairwise: true
